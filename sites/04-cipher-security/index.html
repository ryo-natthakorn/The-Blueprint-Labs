<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>CIPHER — Offensive Security</title>
<meta name="description" content="CIPHER, a red-team consultancy. The whole site is a working terminal on a phosphor CRT: type commands, run a demonstration recon sweep and read redacted casework.">
<meta name="theme-color" content="#020604">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/sites/04-cipher-security/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
  }
}
</script>
</head>
<body>

<main class="console">
  <h1 class="sr-only">CIPHER — offensive security, defensively applied</h1>

  <div class="screen" id="screen">
    <canvas id="crt" aria-hidden="true"></canvas>
    <form id="prompt-form" class="prompt" autocomplete="off">
      <label for="cmd" class="sr-only">Terminal command. Type help and press Enter.</label>
      <input id="cmd" name="cmd" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="send" />
    </form>
  </div>
  <div class="sr-only" id="sr-log" role="log" aria-live="polite" aria-label="Terminal output"></div>

  <div class="panel">
    <nav class="quick" aria-label="Quick commands">
      <span class="quick-label" aria-hidden="true">run</span>
      <button type="button" data-cmd="help">help</button>
      <button type="button" data-cmd="services">services</button>
      <button type="button" data-cmd="scan demo.target">scan</button>
      <button type="button" data-cmd="casework">casework</button>
      <button type="button" data-cmd="team">team</button>
      <button type="button" data-cmd="theme">theme</button>
      <button type="button" data-cmd="clear">clear</button>
    </nav>
    <footer class="baseline">
      <span class="led" aria-hidden="true"></span>
      <span>CIPHER is a fictional consultancy — a Blueprint Labs capability study.</span>
      <a href="/">← The Blueprint Labs</a>
    </footer>
  </div>
</main>

<script type="module" src="/sites/04-cipher-security/script.js"></script>
</body>
</html>
